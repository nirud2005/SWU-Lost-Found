<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Lost & Found – ของหายได้คืน</title>
<meta name="description" content="เว็บแจ้งของหาย/ของที่เก็บได้ สำหรับนักศึกษา มศว">
<meta name="theme-color" content="#2f6fe4">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🎒</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--b:#2f6fe4;--b2:#1d4fb8;--bl:#e8f1ff;--bl2:#d3e5ff;--bg:#eef5ff;--tx:#17325c;--mu:#6a82a8;--ln:#d6e4fa;--w:#fff;--rd:#e5484d;--gr:#1fa971;--am:#f0a020;color-scheme:light}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px 'Prompt',system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:84px}
@media(min-width:700px){body{background:linear-gradient(135deg,#cfe2ff,#eaf3ff)}#app{margin:20px auto;min-height:calc(100vh - 40px);border-radius:28px;box-shadow:0 20px 60px #2f6fe433;overflow:hidden}}
.bar{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;background:var(--w);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--ln)}
.bar h2{font-size:17px;font-weight:600;flex:1}.ib{border:0;background:var(--bl);color:var(--b);width:36px;height:36px;border-radius:50%;font-size:17px;cursor:pointer;position:relative}
.dot{position:absolute;top:5px;right:6px;width:9px;height:9px;background:var(--rd);border-radius:50%}
main{padding:14px}
.card{background:var(--w);border:1px solid var(--ln);border-radius:18px;padding:12px;margin-bottom:12px}
.in,select,textarea{width:100%;padding:12px;border:1px solid var(--ln);border-radius:12px;background:var(--w);color:var(--tx);font:inherit}
label.l{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px}label.l i{color:var(--rd);font-style:normal}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:14px;background:var(--b);color:#fff;font:inherit;font-weight:500;cursor:pointer;text-align:center;margin-top:12px}
.btn.o{background:var(--w);color:var(--b);border:1.5px solid var(--b)}.btn.g{background:var(--gr)}
.seg{display:flex;background:var(--bl2);border-radius:14px;padding:3px;gap:3px}.seg button{flex:1;border:0;background:none;padding:10px;border-radius:12px;font:inherit;color:var(--b);cursor:pointer}.seg .on{background:var(--b);color:#fff}
.tag{display:inline-block;font-size:11.5px;padding:2px 10px;border-radius:99px;font-weight:500}.t-lost{background:#ffe5e6;color:var(--rd)}.t-found{background:#dcf7ea;color:var(--gr)}.t-done{background:var(--bl2);color:var(--mu)}
.it{display:flex;gap:12px;align-items:center;cursor:pointer}.th{width:68px;height:68px;border-radius:14px;background:var(--bl);display:flex;align-items:center;justify-content:center;font-size:30px;flex:none;object-fit:cover}
.it h3{font-size:15px;font-weight:500;margin:3px 0}.mu{font-size:12.5px;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.cat{text-align:center;font-size:11.5px;cursor:pointer;border:0;background:none;color:var(--tx);font-family:inherit}.cat span{display:flex;width:52px;height:52px;margin:0 auto 4px;border-radius:16px;background:var(--bl2);align-items:center;justify-content:center;font-size:24px}.cat.on span{background:var(--b)}
.hd{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;font-weight:600}.hd a{font-size:13px;color:var(--b);font-weight:400;cursor:pointer}
.ban{background:linear-gradient(135deg,var(--b),#5b9bff);color:#fff;border-radius:18px;padding:14px;margin-top:12px}.ban b{display:block;margin-bottom:4px}.ban small{opacity:.9}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--w);border-top:1px solid var(--ln);display:flex;align-items:flex-end;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:9}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}nav button i{font-style:normal;font-size:20px}nav button.on{color:var(--b);font-weight:600}
nav .fab{flex:none;width:54px;height:54px;border-radius:50%;background:var(--b);color:#fff;font-size:28px;margin:0 8px;margin-top:-22px;box-shadow:0 6px 16px #2f6fe466;justify-content:center;flex-direction:row}
.up{display:flex;gap:10px}.up label{flex:1;border:1.5px dashed var(--b);background:var(--bl);color:var(--b);border-radius:14px;padding:18px 6px;text-align:center;font-size:13px;cursor:pointer}.up label i{display:block;font-size:26px;font-style:normal}
.hero{height:230px;background:var(--bl2);display:flex;align-items:center;justify-content:center;font-size:90px;position:relative;background-size:cover;background-position:center}
.row{display:flex;gap:8px;margin:7px 0;font-size:14px}.row b{color:var(--mu);font-weight:400;min-width:84px}
.msgs{display:flex;flex-direction:column;gap:8px;padding:14px 14px 100px}.m{max-width:78%;padding:9px 13px;border-radius:16px;font-size:14px}.m.me{align-self:flex-end;background:var(--b);color:#fff;border-bottom-right-radius:4px}.m.o{align-self:flex-start;background:var(--w);border:1px solid var(--ln);border-bottom-left-radius:4px}
.cb{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--w);border-top:1px solid var(--ln);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:9}
.map{height:340px;border-radius:18px;position:relative;overflow:hidden;border:1px solid var(--ln);background:linear-gradient(90deg,#fff6 2px,transparent 2px) 0 0/48px 48px,linear-gradient(#fff6 2px,transparent 2px) 0 0/48px 48px,linear-gradient(160deg,#cfe5ff,#dff0e4)}
.pin{position:absolute;transform:translate(-50%,-100%);font-size:30px;cursor:pointer;border:0;background:none;filter:drop-shadow(0 3px 3px #0003)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:2px;font-size:13px}.cal .h{color:var(--mu);font-size:12px;padding:6px 0}.cal button{border:0;background:none;padding:7px 0;border-radius:50%;font:inherit;color:var(--tx);cursor:pointer;position:relative;aspect-ratio:1}.cal .sel{background:var(--b);color:#fff}.cal .td{outline:1.5px solid var(--b)}.cal .has::after{content:'';position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--am)}
.scan{background:#0b1a33;min-height:100vh;color:#fff}.vf{margin:20px;aspect-ratio:1;border:3px solid #7fb0ff;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:70px;background-size:cover;background-position:center;overflow:hidden}
.sc{display:flex;justify-content:space-around;align-items:center;padding:18px}.sc label,.sc button{color:#fff;background:none;border:0;font:inherit;font-size:12px;text-align:center;cursor:pointer}.sc i{display:block;font-style:normal;font-size:26px}.shut{width:70px;height:70px;border-radius:50%;border:5px solid #fff;background:var(--b)!important}
.mn{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--ln);cursor:pointer}.mn:last-child{border:0}.mn span:nth-child(2){flex:1}.mn i{font-style:normal;color:var(--b);font-size:19px;width:28px}
.stat{display:flex;text-align:center}.stat div{flex:1}.stat b{display:block;font-size:22px;color:var(--b)}
.av{width:64px;height:64px;border-radius:50%;background:var(--bl2);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 6px}
.vr{display:flex;gap:12px;align-items:center;cursor:pointer}.vr i{font-style:normal;font-size:24px}.ck{margin-left:auto;font-size:13px;color:var(--gr)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;z-index:50}
:focus-visible{outline:3px solid #7fb0ff;outline-offset:2px}
.logo{text-align:center;padding:36px 0 10px}.logo .lg{font-size:70px}.logo h1{font-size:30px;line-height:1.1;color:var(--b)}.logo p{color:var(--mu);margin-top:4px}
.sheet{position:fixed;inset:0;background:#0006;z-index:40;display:flex;align-items:flex-end;justify-content:center}.sheet>div{background:var(--bg);width:100%;max-width:480px;max-height:80vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px}
.mapf{border-radius:18px;overflow:hidden;border:1px solid var(--ln);background:var(--bl2);height:300px}.mapf iframe{width:100%;height:100%;border:0;display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--ln);background:var(--w);color:var(--tx);border-radius:99px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}.chip.on{background:var(--b);border-color:var(--b);color:#fff}.chip b{font-weight:500;opacity:.7;margin-left:6px}
a.btn{text-decoration:none}
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-tile-container,.leaflet-layer{position:absolute;left:0;top:0}.leaflet-container{overflow:hidden;background:#dde8f7;touch-action:none;font:inherit}
.leaflet-tile,.leaflet-marker-icon{user-select:none;-webkit-user-drag:none}.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-zoom-animated{transform-origin:0 0}.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right{right:0}
.leaflet-right .leaflet-control{float:right;margin-right:10px}.leaflet-top .leaflet-control{margin-top:10px}.leaflet-left .leaflet-control{margin-left:10px}.leaflet-bottom .leaflet-control{margin-bottom:6px}
.leaflet-bar{box-shadow:0 1px 5px #0004;border-radius:8px;overflow:hidden}.leaflet-bar a{background:#fff;color:#17325c;display:block;width:34px;height:34px;line-height:34px;text-align:center;text-decoration:none;border-bottom:1px solid #d6e4fa;font-size:20px}
.leaflet-control-attribution{background:#fffc;font-size:10px;padding:0 5px}.leaflet-div-icon{background:none;border:0}
.leaflet-tooltip{position:absolute;padding:3px 8px;background:#fff;border:1px solid #bcd0ee;border-radius:8px;white-space:nowrap;font-size:12px;box-shadow:0 1px 3px #0003;pointer-events:none}
.leaflet-popup{position:absolute}.leaflet-popup-content-wrapper{background:#fff;border-radius:14px;box-shadow:0 3px 14px #0004}.leaflet-popup-content{margin:10px 14px;font-size:13px}.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-left:-20px;overflow:hidden;pointer-events:none}.leaflet-popup-tip{width:15px;height:15px;margin:-8px auto 0;transform:rotate(45deg);background:#fff}.leaflet-popup-close-button{position:absolute;top:0;right:0;padding:4px 8px;text-decoration:none;color:#757575}
.unr{border-color:var(--b)!important;background:#f3f8ff!important}.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}.avb{position:absolute;right:-4px;bottom:-4px;background:var(--b);border-radius:50%;width:24px;height:24px;font-size:12px;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<noscript><p style="padding:24px;text-align:center">กรุณาเปิดใช้งาน JavaScript เพื่อใช้งานเว็บไซต์</p></noscript>
<div id="app"><div id="v"></div><nav id="nv"></nav></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=[['👜','กระเป๋า'],['📱','มือถือ'],['🔑','กุญแจ'],['🪪','บัตรนักศึกษา'],['📓','เอกสาร'],['👕','เครื่องแต่งกาย'],['✏️','อุปกรณ์การเรียน'],['⋯','อื่นๆ']];
const MQ='มหาวิทยาลัยศรีนครินทรวิโรฒ ประสานมิตร',PL={'สำนักหอสมุดกลาง':'สำนักหอสมุดกลาง '+MQ,'อาคารเรียนรวม (Learning Tower)':'อาคารเรียนรวม หลวงสวัสดิศาสตรพุทธิ '+MQ,'โรงอาหาร':'โรงอาหาร '+MQ,'อาคารกิจกรรมนิสิต':'อาคารกิจกรรมนิสิต '+MQ,'ทางเข้า ซอยสุขุมวิท 23':'ซอยสุขุมวิท 23 '+MQ,'ทางเข้า ถนนอโศกมนตรี':'ถนนอโศกมนตรี '+MQ,'ทางเข้า ถนนเพชรบุรี':'ถนนเพชรบุรี '+MQ};
const D=864e5,now=Date.now();
const seed=()=>({items:[
{id:1,type:'lost',cat:0,title:'กระเป๋าสตางค์',desc:'กระเป๋าสตางค์หนังสีดำ ยี่ห้อ Uniqlo ภายในมีบัตรนักศึกษาและเงินสดส่วนหนึ่ง',place:'สำนักหอสมุดกลาง',d:now-1*D,contact:'LINE: nong_ta',by:'นักศึกษา ก.',st:'open'},
{id:2,type:'found',cat:1,title:'โทรศัพท์มือถือ',desc:'iPhone สีน้ำเงิน เคสใส เก็บได้ที่ใต้โต๊ะ ฝากไว้ที่จุดบริการนิสิตแล้ว',place:'โรงอาหาร',d:now-2*D,contact:'โทร 081-234-5678',by:'นักศึกษา ข.',st:'open'},
{id:3,type:'found',cat:2,title:'กุญแจ',desc:'พวงกุญแจห้อยตุ๊กตาหมี 3 ดอก มีรีโมทรถ',place:'ทางเข้า ซอยสุขุมวิท 23',d:now-3*D,contact:'IG: swu.keys',by:'นักศึกษา ค.',st:'open'},
{id:4,type:'lost',cat:6,title:'กล่องดินสอสีเขียว',desc:'มีปากกาและยางลบอยู่ข้างใน',place:'อาคารเรียนรวม (Learning Tower)',d:now-0*D,contact:'LINE: pim99',by:'นักศึกษา ง.',st:'open'}],
chats:{},verified:{},saved:[],next:10,user:null});
let S;try{S=JSON.parse(localStorage.getItem('slf')||'null')}catch(e){}if(!S)S=seed();
(()=>{const L={'ห้องสมุดกลาง':'สำนักหอสมุดกลาง','อาคารเรียนรวม':'อาคารเรียนรวม (Learning Tower)','โรงอาหารกลาง':'โรงอาหาร','ลานจอดรถ':'ทางเข้า ซอยสุขุมวิท 23','ป้ายรถรับส่ง':'ทางเข้า ถนนอโศกมนตรี'};(S.items||[]).forEach(i=>{if(L[i.place])i.place=L[i.place]})})();
const save=()=>{try{localStorage.setItem('slf',JSON.stringify(S))}catch(e){toast('พื้นที่เก็บข้อมูลเต็ม')}};
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2000)}
const fd=(t,o)=>new Date(t).toLocaleDateString('th-TH',o||{day:'numeric',month:'short',year:'numeric'}),ft=t=>new Date(t).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}),dk=t=>{const x=new Date(t);return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate()};
const get=id=>S.items.find(i=>i.id==id);
function readImg(f,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))};im.src=r.result};r.readAsDataURL(f)}
const bar=(t,back,extra)=>`<div class="bar">${back?'<button class="ib" onclick="history.back()">‹</button>':''}<h2>${t}</h2>${extra||''}</div>`;
const thumb=i=>i.img?`<img class="th" src="${i.img}" alt="">`:`<div class="th">${CATS[i.cat][0]}</div>`;
const tag=i=>i.st==='done'?'<span class="tag t-done">ส่งคืนแล้ว</span>':`<span class="tag t-${i.type}">${i.type==='lost'?'ของหาย':'ของที่เก็บได้'}</span>`;
const itemRow=i=>`<div class="card it" onclick="location.hash='item-${i.id}'">${thumb(i)}<div style="min-width:0">${tag(i)}<h3>${esc(i.title)}</h3><div class="mu">พบที่: ${esc(i.place)}<br>${fd(i.d)} ${ft(i.d)} น.</div></div></div>`;
let F={type:'lost',cat:'',title:'',desc:'',place:'',date:'',time:'',contact:'',img:''},q='',fc=-1,cm=new Date(),cs=dk(now),ctab='all',nt='all',scanImg='',msel='';

/* 1 login */
function login(reg){return`<main><div class="logo"><div class="lg">🎒</div><h1>Smart<br>Lost & Found</h1><p>“ของหายได้คืน”</p></div>

/* auth: รหัสผ่านถูกแฮช SHA-256 + salt ก่อนเก็บ (เก็บในเบราว์เซอร์เท่านั้น) */
const U=()=>{try{return JSON.parse(localStorage.getItem('slf_users')||'{}')}catch(e){return{}}};
const sU=u=>{try{localStorage.setItem('slf_users',JSON.stringify(u))}catch(e){toast('บันทึกบัญชีไม่ได้')}};
async function hp(p,salt){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+p));return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const rs=()=>[...crypto.getRandomValues(new Uint8Array(12))].map(x=>x.toString(16).padStart(2,'0')).join('');
const er=m=>{const e=$('#err');if(e)e.textContent=m};
async function doLogin(m){
if(m===2){toast('ล็อกอินด้วย Google / Apple / มศว ต้องมีเซิร์ฟเวอร์ ยังไม่เปิดใช้ในเวอร์ชันนี้');return}
if(!(window.crypto&&crypto.subtle))return er('เบราว์เซอร์นี้ไม่รองรับการเข้ารหัส กรุณาเปิดผ่าน https');
const em=$('#em').value.trim().toLowerCase(),pw=$('#pw').value,u=U();
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return er('รูปแบบอีเมลไม่ถูกต้อง');
if(m===1){const nm=$('#nm').value.trim();
if(nm.length<2)return er('กรอกชื่อ-นามสกุล');
if(pw.length<8)return er('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร');
if(pw!==$('#pw2').value)return er('รหัสผ่านไม่ตรงกัน');
if(u[em])return er('อีเมลนี้สมัครแล้ว กรุณาเข้าสู่ระบบ');
const salt=rs();u[em]={name:nm,salt,hash:await hp(pw,salt)};sU(u)}
else{const a=u[em];if(!a||a.hash!==await hp(pw,a.salt))return er('อีเมลหรือรหัสผ่านไม่ถูกต้อง')}
S.user={name:u[em].name,email:em};save();toast('ยินดีต้อนรับ '+u[em].name);location.hash='home'}
async function cpw(){const u=U(),a=u[S.user.email];if(!a){toast('บัญชีนี้ยังไม่มีรหัสผ่าน');return}const o=prompt('รหัสผ่านเดิม');if(o===null)return;if(a.hash!==await hp(o,a.salt)){toast('รหัสผ่านเดิมไม่ถูกต้อง');return}const n=prompt('รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)');if(!n||n.length<8){toast('รหัสผ่านใหม่สั้นเกินไป');return}a.salt=rs();a.hash=await hp(n,a.salt);sU(u);toast('เปลี่ยนรหัสผ่านแล้ว ✓')}

function sf(){['cat','title','desc','place','date','time','contact'].forEach(k=>{const e=$('#'+k);if(e)F[k]=e.value})}
function pk(i){if(!i.files[0])return;sf();readImg(i.files[0],d=>{F.img=d;render()})}

if(new Date(F.date+'T'+(F.time||'00:00'))>new Date()){toast('วันที่พบต้องไม่เป็นอนาคต');return}

:n===2?`<p class="mu">ถ่ายรูปบัตรนักศึกษาด้านหน้าให้เห็นชื่อและรูปชัดเจน ปิดเลขบัตรประชาชน (ถ้ามี) ก่อนถ่าย</p><div class="up" style="margin-top:10px"><label><i>📷</i>ถ่ายรูปบัตร<input type="file" accept="image/*" capture="environment" hidden onchange="vPic(this)"></label><label><i>⬆️</i>อัปโหลด<input type="file" accept="image/*" hidden onchange="vPic(this)"></label></div>${v.img?`<img src="${v.img}" alt="รูปบัตรนักศึกษา" style="width:100%;max-height:200px;object-fit:cover;border-radius:14px;margin-top:10px">`:''}<div class="up"><button class="btn o" onclick="vBack()">ย้อนกลับ</button><button class="btn" onclick="vNext(2)">ถัดไป</button></div><p class="mu" style="margin-top:10px">เวอร์ชันเดโมเก็บรูปไว้ในเบราว์เซอร์ของคุณเท่านั้น</p>`
:`<label class="l" for="vm">อีเมลมหาวิทยาลัย</label><input class="in" id="vm" type="email" value="${esc(v.mail||'')}" placeholder="name@g.swu.ac.th"><button class="btn o" onclick="vSend()">${v.otp?'ส่งรหัสอีกครั้ง':'ส่งรหัสยืนยัน'}</button>${v.otp?`<div class="card" style="background:var(--bl);margin-top:12px"><b>รหัสทดลอง: ${v.otp}</b><div class="mu">เดโมไม่ส่งอีเมลจริง ระบบจริงจะส่งรหัส 6 หลักไปที่อีเมลนี้ (หมดอายุใน 5 นาที)</div></div><label class="l" for="vcode">กรอกรหัส 6 หลัก</label><input class="in" id="vcode" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button class="btn" onclick="vOk()">ยืนยันและส่งคำขอ</button>`:''}<button class="btn o" onclick="vBack()">ย้อนกลับ</button>`;
return`${hd}<main>${ic('🛡️','ยืนยันตัวตนนิสิต','ช่วยให้ผู้อื่นมั่นใจเมื่อนัดรับของ ทำครบ 3 ขั้นตอน')}<div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:6px">${sp}</div><div class="card">${b}</div></main>`}

const TT={login:'เข้าสู่ระบบ',register:'สมัครสมาชิก',home:'หน้าหลัก',post:'ประกาศ',map:'แผนที่',cal:'ปฏิทิน',me:'โปรไฟล์',scan:'สแกนรูป',verify:'ยืนยันตัวตน',notif:'แจ้งเตือน',prefs:'ตั้งค่า',hist:'ประวัติประกาศ',saved:'รายการที่บันทึก',item:'รายละเอียดประกาศ',chat:'แชท',event:'กิจกรรมรายวัน'};
const R0=render;render=function(){R0();{const r0=location.hash.slice(1);if(r0==='map')initMap();if(r0==='post')initPick()}document.querySelectorAll('#v [onclick]').forEach(e=>{if(!/^(BUTTON|A|INPUT|SELECT)$/.test(e.tagName)){e.setAttribute('role','button');e.tabIndex=0}});document.title=(TT[(location.hash.slice(1)||'login').split('-')[0]]||'')+' – Smart Lost & Found'};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const s=document.querySelector('.sheet');if(s)s.remove()}if(e.key==='Enter'&&e.target.matches('.card .in')&&['login','register'].includes(location.hash.slice(1)||'login')){const b=document.querySelector('.card .btn');if(b)b.click()}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button]')){e.preventDefault();e.target.click()}});
/* ===== avatar, real map, shared database ===== */
const SB_URL='',SB_KEY='';/* ใส่ Project URL และ anon key จาก Supabase (ดู README) */
const ON=!!(SB_URL&&SB_KEY),TILE='https://tile.openstreetmap.org/{z}/{x}/{y}.png',VB='100.558,13.7515,100.5715,13.7405';
let SES=null,PICK=null,LM=null,GEO={};try{SES=JSON.parse(localStorage.getItem('slf_s')||'null')}catch(e){}try{GEO=JSON.parse(localStorage.getItem('slf_geo')||'{}')}catch(e){}
const avh=()=>{const a=S.user&&(S.user.avatar||(U()[S.user.email]||{}).avatar);return`<label class="av" style="position:relative;cursor:pointer" title="เปลี่ยนรูปโปรไฟล์">${a?`<img src="${a}" alt="รูปโปรไฟล์">`:'👩‍🎓'}<span class="avb">📷</span><input type="file" accept="image/*" hidden onchange="setAv(this)"></label>`};
function setAv(i){const f=i.files[0];if(!f)return;if(!/^image\//.test(f.type))return toast('เลือกไฟล์รูปภาพเท่านั้น');readImg(f,d=>{S.user.avatar=d;const u=U();if(u[S.user.email]){u[S.user.email].avatar=d;sU(u)}save();render();toast('เปลี่ยนรูปโปรไฟล์แล้ว ✓')})}
const ic=e=>L.divIcon({html:'<div style="font-size:26px;line-height:1;filter:drop-shadow(0 2px 2px #0005)">'+e+'</div>',iconSize:[26,26],iconAnchor:[13,26],className:''});
let lastGeo=0;async function geo(p){if(GEO[p])return GEO[p];const w=1100-(Date.now()-lastGeo);if(w>0)await new Promise(r=>setTimeout(r,w));lastGeo=Date.now();try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&bounded=1&viewbox='+VB+'&accept-language=th&q='+encodeURIComponent(PL[p].replace(MQ,'').trim()));const j=await r.json();if(j[0]){GEO[p]=[+j[0].lat,+j[0].lon];try{localStorage.setItem('slf_geo',JSON.stringify(GEO))}catch(e){}return GEO[p]}}catch(e){}return null}
const gate=p=>p.startsWith('ทางเข้า');
async function initMap(){const el=$('#lmap');if(!el)return;if(!window.L){el.innerHTML='<p class="mu" style="padding:24px;text-align:center">โหลดแผนที่ไม่ได้ ตรวจสอบอินเทอร์เน็ต หรือกดปุ่มเปิดใน Google Maps</p>';return}
const M=LM=L.map(el).setView(CAMPUS,17);L.tileLayer(TILE,{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(M);
S.items.filter(i=>i.lat&&i.st==='open').forEach(i=>L.marker([i.lat,i.lng],{icon:ic(i.type==='lost'?'🔴':'🟢')}).addTo(M).bindPopup(`<b>${esc(i.title)}</b><br>${esc(i.place)}<br><a href="#item-${i.id}">ดูรายละเอียด</a>`));
if(msel&&!gate(msel)){const c=await geo(msel);if(c&&LM===M)M.setView(c,19)}
for(const p of Object.keys(PL).filter(x=>!gate(x))){const c=await geo(p);if(LM!==M)return;if(c)L.marker(c,{icon:ic('📍')}).addTo(M).bindTooltip(p,{permanent:true,direction:'top',offset:[0,-26]})}}
let PM=null,PMK=null;
const dist=(a,b)=>Math.hypot((a[0]-b[0])*111e3,(a[1]-b[1])*105e3);
function setPick(c,name){PICK=c;if(PM){if(PMK)PMK.setLatLng(c);else PMK=L.marker(c,{icon:ic('📍')}).addTo(PM)}const pl=$('#pll');if(pl)pl.textContent='ปักหมุดแล้ว ✓ (แตะอีกครั้งเพื่อย้าย)';if(name){const e=$('#place');if(e)e.value=name;F.place=name}}
async function nameAt(c){let best=null,bd=70;for(const p of Object.keys(PL))if(GEO[p]){const d=dist(c,GEO[p]);if(d<bd){bd=d;best=p}}if(best)return best;
try{const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=json&zoom=18&accept-language=th&lat='+c[0]+'&lon='+c[1]),j=await r.json(),a=j.address||{};return j.name||a.building||a.amenity||a.road||'ตำแหน่งที่ปักหมุด'}catch(e){return 'ตำแหน่งที่ปักหมุด'}}
async function plChg(){const v=$('#place').value.trim();F.place=v;if(PL[v]&&!gate(v)){const c=await geo(v);if(c){if(PM)PM.setView(c,19);setPick(c)}}}
function initPick(){const el=$('#pmap');if(!el)return;if(!window.L){el.innerHTML='<p class="mu" style="padding:16px">โหลดแผนที่ไม่ได้</p>';return}
PMK=null;const M=PM=L.map(el).setView(PICK||CAMPUS,PICK?19:17);L.tileLayer(TILE,{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(M);if(PICK)PMK=L.marker(PICK,{icon:ic('📍')}).addTo(M);
M.on('click',async e=>{const c=[+e.latlng.lat.toFixed(6),+e.latlng.lng.toFixed(6)];setPick(c);setPick(c,await nameAt(c))});
(async()=>{for(const p of Object.keys(PL).filter(x=>!gate(x)))await geo(p)})()}
const _sp=submitPost;submitPost=function(){const n=S.items.length,pk=PICK;_sp();if(S.items.length<=n)return;const it=S.items[0];if(pk){it.lat=pk[0];it.lng=pk[1]}PICK=null;save();if(!ON)return;
rq('POST','/rest/v1/items',{type:it.type,cat:it.cat,title:it.title,descr:it.desc,place:it.place,lat:it.lat||null,lng:it.lng||null,d:it.d,contact:it.contact,by_name:it.by,st:'open',img:it.img||null},'return=representation').then(r=>{const o=it.id;it.id=r[0].id;save();pull.k='';if(location.hash==='#item-'+o)location.hash='item-'+it.id}).catch(e=>{S.items=S.items.filter(x=>x!==it);save();toast('โพสต์ไม่สำเร็จ: '+e.message);location.hash='post'})};
const _dn=dn;dn=function(id){_dn(id);if(ON)rq('PATCH','/rest/v1/items?id=eq.'+id,{st:'done'}).catch(e=>toast('อัปเดตไม่สำเร็จ: '+e.message))};
const _rm=rm;rm=function(id){_rm(id);if(ON&&!get(id))rq('DELETE','/rest/v1/items?id=eq.'+id).catch(e=>toast('ลบไม่สำเร็จ: '+e.message))};
async function rq(m,path,body,pre,retry){const h={apikey:SB_KEY,'Content-Type':'application/json',Authorization:'Bearer '+((S.user&&SES&&SES.access_token)||SB_KEY)};if(pre)h.Prefer=pre;const r=await fetch(SB_URL+path,{method:m,headers:h,body:body?JSON.stringify(body):undefined});
if(r.status===401&&!retry&&SES&&SES.refresh_token){try{const x=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:SES.refresh_token})});if(x.ok){SES=await x.json();localStorage.setItem('slf_s',JSON.stringify(SES));return rq(m,path,body,pre,1)}}catch(e){}}
const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}if(!r.ok)throw new Error((j&&(j.msg||j.message||j.error_description))||('HTTP '+r.status));return j}
const row2=r=>{const me=SES&&S.user&&r.user_id===SES.user.id;return{id:r.id,type:r.type,cat:r.cat,title:r.title,desc:r.descr,place:r.place,lat:r.lat,lng:r.lng,d:+r.d,contact:r.contact,by:r.by_name,st:r.st,img:r.img,mine:me?1:0,owner:me?S.user.email:r.user_id}};
async function pull(){if(!ON)return;try{const r=await rq('GET','/rest/v1/items?select=*&order=d.desc&limit=200'),n=r.map(row2),k=JSON.stringify(n);if(k!==pull.k){pull.k=k;S.items=n;save();if(['home','map','cal','me','hist','notif','saved','item'].includes(location.hash.slice(1).split('-')[0]))render()}}catch(e){}}
if(ON){S.items=S.items.filter(i=>i.owner);if(S.user&&!SES){S.user=null;save()}
const _dl=doLogin;doLogin=async function(m){if(m===2)return _dl(m);const em=$('#em').value.trim().toLowerCase(),pw=$('#pw').value;if(!EM.test(em))return er('กรอกอีเมลให้ถูกต้อง');if(pw.length<8)return er('รหัสผ่านอย่างน้อย 8 ตัวอักษร');
try{let r;if(m===1){const nm=$('#nm').value.trim();if(nm.length<2)return er('กรอกชื่อ-นามสกุล');if(pw!==$('#pw2').value)return er('รหัสผ่านทั้งสองช่องไม่ตรงกัน');r=await rq('POST','/auth/v1/signup',{email:em,password:pw,data:{name:nm}});if(!r.access_token)return er('สมัครแล้ว กรุณายืนยันอีเมลก่อนเข้าสู่ระบบ')}else r=await rq('POST','/auth/v1/token?grant_type=password',{email:em,password:pw});
SES=r;localStorage.setItem('slf_s',JSON.stringify(r));S.user={name:(r.user.user_metadata&&r.user.user_metadata.name)||em.split('@')[0],email:em};save();pull.k='';await pull();location.hash='home'}catch(e){er(/invalid login/i.test(e.message)?'อีเมลหรือรหัสผ่านไม่ถูกต้อง':e.message)}};
pull();setInterval(pull,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()})}
window.addEventListener('hashchange',render);render();
</script>
